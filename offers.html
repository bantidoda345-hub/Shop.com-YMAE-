<!DOCTYPE html>
<html>
<head>
<title>YMAE Offers</title>
<style>
body{
font-family:sans-serif;
background:#020617;
color:white;
padding:20px;
}
.container{
max-width:1200px;
margin:auto;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}
.card{
background:#111827;
padding:25px;
border-radius:25px;
}
.card img{
width:100%;
border-radius:18px;
height:200px;
object-fit:cover;
}
button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#f59e0b;
color:white;
font-weight:bold;
margin-top:15px;
}
</style>
</head>
<body>
<div class="container">
<h1>YMAE Product Offers</h1>
<br>
<div class="grid">
<div class="card">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9">
<h2>iPhone Offer</h2>
<p>Flat ₹5000 Cashback</p>
<button>Claim Offer</button>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1580910051074-3eb694886505">
<h2>AC Offer</h2>
<p>No Cost EMI Available</p>
<button>Claim Offer</button>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef">
<h2>Laptop Offer</h2>
<p>Student Discount Available</p>
<button>Claim Offer</button>
</div>
</div>
</div>
</body>
</html>
