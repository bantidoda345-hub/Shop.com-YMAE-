<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offer Product Manager</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#020617,#0f172a,#111827);
color:#fff;
padding:35px;
min-height:100vh;
}

.container{
max-width:1700px;
margin:auto;
}

.heading{
text-align:center;
font-size:52px;
padding-top:40px;
font-weight:700;
margin-bottom:25px;
}

.form-box{
background:rgba(30,41,59,0.95);
padding:35px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:15px;
}

.input-box{
display:flex;
flex-direction:column;
}

.input-box label{
margin-bottom:8px;
font-size:14px;
font-weight:600;
}

.input-box input{
padding:18px;
border:none;
border-radius:12px;
outline:none;
font-size:15px;
background:#334155;
color:#fff;
}

.image-preview{
width:100%;
height:340px;
background:#334155;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
margin-top:10px;
}

.image-preview img{
width:100%;
height:100%;
object-fit:cover;
}

.btn{
margin-top:25px;
width:100%;
padding:20px;
border:none;
border-radius:14px;
font-size:17px;
font-weight:700;
cursor:pointer;
transition:0.3s;
}

.save-btn{
background:#22c55e;
color:#fff;
}

.save-btn:hover{
transform:scale(1.02);
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
gap:20px;
}

.card{
background:#1e293b;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 15px rgba(0,0,0,0.4);
position:relative;
}

.card img{
width:100%;
height:340px;
object-fit:cover;
}

.card-content{
padding:28px;
}

.product-name{
font-size:32px;
font-weight:700;
margin-bottom:12px;
}

.price-box{
display:flex;
align-items:center;
gap:12px;
flex-wrap:wrap;
margin-bottom:12px;
}

.mrp{
text-decoration:line-through;
color:#94a3b8;
font-size:18px;
}

.offer-price{
font-size:38px;
font-weight:800;
color:#22c55e;
}

.discount{
background:#ef4444;
padding:6px 12px;
border-radius:50px;
font-size:14px;
font-weight:700;
}

.delete-btn{
width:100%;
padding:18px;
border:none;
background:#dc2626;
color:#fff;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.empty{
text-align:center;
padding:40px;
background:#1e293b;
border-radius:20px;
font-size:18px;
color:#94a3b8;
}

@media(max-width:900px){
body{
padding:15px;
}

.heading{
font-size:32px;
}

.form-box{
padding:20px;
}

.products{
grid-template-columns:1fr;
}

.card img{
height:250px;
}

.image-preview{
height:240px;
}
}
.setting-btn{
position:fixed;
top:18px;
right:18px;
width:52px;
height:52px;
border:none;
border-radius:50%;
background:#22c55e;
color:#fff;
font-size:20px;
cursor:pointer;
z-index:1001;
box-shadow:0 0 12px rgba(34,197,94,0.4);
}

.side-panel{
position:fixed;
top:0;
right:-550px;
width:520px;
height:100vh;
background:#0f172a;
padding:25px;
overflow-y:auto;
transition:0.4s;
z-index:1002;
box-shadow:-10px 0 30px rgba(0,0,0,0.5);
}

.side-panel.active{
right:0;
}

.side-panel{
right:-550px;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(4px);
display:none;
z-index:1000;
}

.overlay.active{
display:block;
}

.panel-top{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
}

.panel-top h2{
font-size:28px;
}

.close-btn{
width:50px;
height:50px;
border:none;
border-radius:50%;
background:#ef4444;
color:#fff;
font-size:22px;
cursor:pointer;
}

@media(max-width:700px){
.heading{
font-size:28px;
padding-top:65px;
}

.side-panel{
width:100%;
right:-100%;
padding:15px;
}

.setting-btn{
width:48px;
height:48px;
font-size:18px;
right:10px;
top:10px;
}
}

</style></head>
<body><div class="container"><div class="heading">
<i class="fa-solid fa-tags"></i>
Offer Product Panel
</div><button class="setting-btn" id="settingsBtn">
<i class="fa-solid fa-gear"></i>
</button><div class="overlay" id="overlay"></div><script>
document.addEventListener('DOMContentLoaded', function(){
const sidePanel = document.getElementById('sidePanel');
const overlay = document.getElementById('overlay');
const settingsBtn = document.getElementById('settingsBtn');
const closePanelBtn = document.getElementById('closePanelBtn');

if(settingsBtn){
settingsBtn.onclick = function(){
sidePanel.style.right = '0';
overlay.style.display = 'block';
};
}

if(closePanelBtn){
closePanelBtn.onclick = function(){
sidePanel.style.right = '-550px';
overlay.style.display = 'none';
};
}

if(overlay){
overlay.onclick = function(){
sidePanel.style.right = '-550px';
overlay.style.display = 'none';
};
}
});
</script><div class="side-panel" id="sidePanel">
<div class="panel-top">
<h2><i class="fa-solid fa-sliders"></i> Product Settings</h2>
<button class="close-btn" id="closePanelBtn">
<i class="fa-solid fa-xmark"></i>
</button>
</div><div class="form-box">
<div class="grid"><div class="input-box">
<label>Product Name</label>
<input type="text" id="productName" placeholder="Enter product name">
</div><div class="input-box">
<label>MRP Price</label>
<input type="number" id="mrp" placeholder="Enter MRP">
</div><div class="input-box">
<label>Discount %</label>
<input type="number" id="discount" placeholder="Enter discount %">
</div><div class="input-box">
<label>Offer Price</label>
<input type="number" id="offerPrice" placeholder="Auto calculated" readonly>
</div></div><div class="input-box" style="margin-top:15px;">
<label>Upload Product Image</label>
<input type="file" id="imageInput" accept="image/*"><div class="image-preview" id="previewBox">
<span>Image Preview</span>
</div>
</div><button class="btn save-btn" onclick="saveProduct()">
<i class="fa-solid fa-floppy-disk"></i>
Save Product
</button>
</div></div><div class="products" id="productList"></div></div><script>
const mrpInput = document.getElementById('mrp');
const discountInput = document.getElementById('discount');
const offerPriceInput = document.getElementById('offerPrice');
const imageInput = document.getElementById('imageInput');
const previewBox = document.getElementById('previewBox');
const productList = document.getElementById('productList');

let imageData = "";

function calculateOfferPrice(){
const mrp = parseFloat(mrpInput.value) || 0;
const discount = parseFloat(discountInput.value) || 0;

const offerPrice = mrp - (mrp * discount / 100);
offerPriceInput.value = offerPrice.toFixed(0);
}

mrpInput.addEventListener('input', calculateOfferPrice);
discountInput.addEventListener('input', calculateOfferPrice);

imageInput.addEventListener('change', function(){
const file = this.files[0];

if(file){
const reader = new FileReader();
reader.onload = function(e){
imageData = e.target.result;
previewBox.innerHTML = `<img src="${imageData}">`;
}
reader.readAsDataURL(file);
}
});

function saveProduct(){
const productName = document.getElementById('productName').value;
const mrp = mrpInput.value;
const discount = discountInput.value;
const offerPrice = offerPriceInput.value;

if(!productName || !mrp || !discount || !imageData){
alert('Please fill all details');
return;
}

const product = {
id: Date.now(),
productName,
mrp,
discount,
offerPrice,
imageData
};

let products = JSON.parse(localStorage.getItem('offerProducts')) || [];
products.unshift(product);

localStorage.setItem('offerProducts', JSON.stringify(products));

clearForm();
const sidePanel = document.getElementById('sidePanel');
const overlay = document.getElementById('overlay');
const settingsBtn = document.getElementById('settingsBtn');
const closePanelBtn = document.getElementById('closePanelBtn');

settingsBtn.addEventListener('click', () => {
sidePanel.classList.add('active');
overlay.classList.add('active');
});

closePanelBtn.addEventListener('click', () => {
sidePanel.classList.remove('active');
overlay.classList.remove('active');
});

overlay.addEventListener('click', () => {
sidePanel.classList.remove('active');
overlay.classList.remove('active');
});

loadProducts();
}

function loadProducts(){
let products = JSON.parse(localStorage.getItem('offerProducts')) || [];

if(products.length === 0){
productList.innerHTML = `
<div class="empty">
<i class="fa-solid fa-box-open"></i><br><br>
No Products Added
</div>`;
return;
}

productList.innerHTML = products.map(product => `
<div class="card">
<img src="${product.imageData}">

<div class="card-content">
<div class="product-name">${product.productName}</div>

<div class="price-box">
<div class="mrp">₹${product.mrp}</div>
<div class="offer-price">₹${product.offerPrice}</div>
<div class="discount">${product.discount}% OFF</div>
</div>
</div>

<button class="delete-btn" onclick="deleteProduct(${product.id})">
<i class="fa-solid fa-trash"></i>
Delete Product
</button>
</div>
`).join('');
}

function deleteProduct(id){
let products = JSON.parse(localStorage.getItem('offerProducts')) || [];
products = products.filter(product => product.id !== id);

localStorage.setItem('offerProducts', JSON.stringify(products));
loadProducts();
}

function clearForm(){
document.getElementById('productName').value = '';
mrpInput.value = '';
discountInput.value = '';
offerPriceInput.value = '';
imageInput.value = '';
imageData = '';
previewBox.innerHTML = '<span>Image Preview</span>';
}

loadProducts();
</script></body>
</html>
