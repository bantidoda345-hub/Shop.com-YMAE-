<!DOCTYPE html>
<html>
<head>
<title>YMAE Settings</title>
<style>
body{
font-family:sans-serif;
background:#020617;
color:white;
padding:20px;
}
.container{
max-width:700px;
margin:auto;
background:#111827;
padding:30px;
border-radius:25px;
}
.setting{
background:#1e293b;
padding:20px;
border-radius:18px;
margin-top:20px;
display:flex;
justify-content:space-between;
align-items:center;
}
select,input{
padding:12px;
border:none;
border-radius:12px;
}
</style>
</head>
<body>
<div class="container">
<h1>YMAE Settings</h1>
<div class="setting">
<span>Theme Mode</span>
<select>
<option>Dark</option>
<option>Light</option>
</select>
</div>
<div class="setting">
<span>Notification</span>
<input type="checkbox" checked>
</div>
<div class="setting">
<span>Profile Visibility</span>
<select>
<option>Private</option>
<option>Public</option>
</select>
</div>
<div class="setting">
<span>Portal Security</span>
<select>
<option>High</option>
<option>Normal</option>
</select>
</div>
</div>
</body>
</html>
