<!DOCTYPE html>
<html>
<head>
<title>YMAE Admin</title>
<style>
body{
font-family:sans-serif;
background:#020617;
color:white;
padding:20px;
}
.login,.panel{
max-width:800px;
margin:auto;
background:#111827;
padding:30px;
border-radius:25px;
margin-top:50px;
}
input,button{
width:100%;
padding:16px;
margin-top:15px;
border:none;
border-radius:14px;
}
button{
background:#dc2626;
color:white;
font-weight:bold;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:25px;
}
.card{
background:#1e293b;
padding:25px;
border-radius:20px;
}
</style>
</head>
<body>
<div class="login" id="loginBox">
<h1>YMAE Admin Login</h1>
<input type="password" id="pass" placeholder="Enter Password">
<button onclick="login()">Login</button>
</div>
<div class="panel" id="panel" style="display:none;">
<h1>Admin Dashboard</h1>
<div class="grid">
<div class="card">
<h3>Total Customers</h3>
<p>1520</p>
</div>
<div class="card">
<h3>Cashback Offers</h3>
<p>48 Active</p>
</div>
<div class="card">
<h3>EMI Requests</h3>
<p>210 Pending</p>
</div>
<div class="card">
<h3>System Status</h3>
<p>Secure</p>
</div>
</div>
</div>
<script>
function login(){
let p=document.getElementById('pass').value;
if(p==='0000'){
document.getElementById('loginBox').style.display='none';
document.getElementById('panel').style.display='block';
}else{
alert('Wrong Password');
}
}
</script>
</body>
</html>
